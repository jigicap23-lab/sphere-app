<!DOCTYPE html>
<html>

<head>

    <title>K.B. Vira Sphere 2003-2004</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f172a;
            font-family:Arial,sans-serif;
        }

        .wrapper{
            display:flex;
            justify-content:center;
        }

        .container{
            width:100%;
            min-height:100vh;
            background:white;
            display:flex;
            flex-direction:column;
            position:relative;
        }

        @media (min-width:768px){

            .container{
                max-width:400px;
            }

        }

        /* TOP BAR */

        .top-bar{
            background:#2d1ea2;
            color:white;
            padding:14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            position:sticky;
            top:0;
            z-index:100;
        }

        .top-title{
            font-size:16px;
            font-weight:bold;
        }

        /* SCREEN */

        #screen{
            flex:1;
            padding:10px;
            overflow-y:auto;
        }

        /* BOTTOM NAV */

        .bottom-nav{
            background:#2d1ea2;
            display:flex;
            justify-content:space-around;
            padding:12px 5px;
            position:sticky;
            bottom:0;
        }

        .bottom-nav button{
            background:none;
            border:none;
            color:white;
            display:flex;
            flex-direction:column;
            align-items:center;
            font-size:12px;
            cursor:pointer;
        }

        /* HOME IMAGE */

        .launch-image{
            width:100%;
            border-radius:10px;
        }

        /* GRID */

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
        }

        /* CARD */

        .card{
            background:#f3f4f6;
            border-radius:12px;
            overflow:hidden;
            cursor:pointer;
            border:1px solid #ddd;
        }

        .card img{
            width:100%;
            height:170px;
            object-fit:cover;
        }

        .name{
            padding:10px;
            font-size:14px;
            font-weight:bold;
        }

        /* PROFILE */

        .profile-image{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:12px;
            margin-bottom:20px;
        }

        .field{
            margin-bottom:18px;
            background:#f5f5f5;
            padding:12px;
            border-radius:10px;
        }

        .label{
            font-size:12px;
            color:gray;
            margin-bottom:5px;
        }

        .value{
            font-size:16px;
            color:#111;
        }

        /* BUTTONS */

        .main-btn{
            background:#2d1ea2;
            color:white;
            border:none;
            padding:12px;
            border-radius:10px;
            cursor:pointer;
            width:100%;
            margin-top:10px;
        }

        .delete-btn{
            background:red;
            color:white;
            border:none;
            padding:12px;
            border-radius:10px;
            cursor:pointer;
            width:100%;
            margin-top:10px;
        }

        input{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            margin-top:5px;
        }

    </style>

</head>

<body>

<div class="wrapper">

    <div class="container">

        <!-- TOP BAR -->

        <div class="top-bar">

            <div class="top-title">
                K.B. Vira Sphere
            </div>

            <div>
                2003-2004
            </div>

        </div>

        <!-- SCREEN -->

        <div id="screen">

            <img
            src="K B Vira Sphere Launch Image.jpeg"
            class="launch-image">

        </div>

        <!-- BOTTOM NAV -->

        <div class="bottom-nav">

            <button onclick="showScreen('Admin Approval')">
                <div>✅</div>
                <span>Admin</span>
            </button>

            <button onclick="showScreen('My_Profile')">
                <div>👤</div>
                <span>My_Profile</span>
            </button>

            <button onclick="showScreen('Sphere Connect')">
                <div>🌐</div>
                <span>Sphere Connect</span>
            </button>

        </div>

    </div>

</div>

<script>

    /* ======================================
       ADMIN SETTINGS
    ====================================== */

    const adminMobile = "96892704243";

    const currentUserMobile = "96892704243";

    let allUsers = [];

    /* ======================================
       LOAD USERS FROM GOOGLE SHEET
    ====================================== */

    async function loadUsers(){

        const response = await fetch(
            "https://opensheet.elk.sh/12xzIugi4Ur41T0rpARaPUVmhZlCmXWMUwnrwaE44EB8/Form responses 1"
        );

        const data = await response.json();

        allUsers = data;

        return data;
    }

    /* ======================================
       MAIN NAVIGATION
    ====================================== */

    function showScreen(screen){

        const area = document.getElementById("screen");

        /* ======================================
           ADMIN SCREEN
        ====================================== */

        if(screen === "Admin Approval"){

            if(currentUserMobile !== adminMobile){

                area.innerHTML = `

                    <div style="padding:20px">

                        <h2>
                            Access Denied
                        </h2>

                        <p style="margin-top:10px">
                            Only admin can view this page.
                        </p>

                    </div>

                `;

                return;
            }

            loadUsers().then(users => {

                let html = `

                    <h2 style="margin-bottom:20px;">
                        Admin Approval
                    </h2>

                `;

                users.forEach(user => {

                    html += `

                        <div class="field">

                            <div class="value">
                                ${user["Full Name"] || ""}
                            </div>

                            <div class="label">
                                ${user["Mobile Number with Country Code"] || ""}
                            </div>

                            <div style="margin-top:10px;">

                                Status :
                                ${user["Approved"] || "FALSE"}

                            </div>

                        </div>

                    `;

                });

                area.innerHTML = html;

            });

        }

        /* ======================================
           MY PROFILE
        ====================================== */

        if(screen === "My_Profile"){

            loadUsers().then(users => {

                const me = users.find(user =>

                    user["Mobile Number with Country Code"]
                    === currentUserMobile

                );

                if(!me){

                    area.innerHTML = `
                        <h2>User not found</h2>
                    `;

                    return;
                }

                area.innerHTML = `

                    <div>

                        <img
                        src="${me["Profile Photo"]}"
                        class="profile-image">

                        <button
                        class="main-btn"
                        onclick='editProfile(${JSON.stringify(me)})'>

                            Edit Profile

                        </button>

                        <button
                        class="delete-btn">

                            Delete Profile

                        </button>

                        <div style="height:20px"></div>

                        ${profileFields(me)}

                    </div>

                `;

            });

        }

        /* ======================================
           SPHERE CONNECT
        ====================================== */

        if(screen === "Sphere Connect"){

            loadUsers().then(users => {

                let html = `

    <input
    type="text"
    id="searchBox"
    placeholder="Search students..."
    onkeyup="filterCards()"

    style="
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border-radius:10px;
        border:1px solid #ccc;
    ">

    <div class="grid">
`;

                users.forEach(user => {

                    if(user["Approved"] === "TRUE"){

                        html += `

                    <div
                    class="card"

                    data-search='${JSON.stringify(user).toLowerCase()}'

                    onclick="openProfileFromSheet(${users.indexOf(user)})">

                        <img
                        src="${user["Profile Photo"]}">

                        <div class="name">

                             ${user["Full Name"]}

                    </div>

                </div>

            `;
                    }

                });

                html += `</div>`;

                area.innerHTML = html;

            });

        }

    }

    /* ======================================
       PROFILE FIELD TEMPLATE
    ====================================== */

    function profileFields(user){

        return `

            <div class="field">

                <div class="label">
                    Full Name
                </div>

                <div class="value">
                    ${user["Full Name"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Date of Birth
                </div>

                <div class="value">
                    ${user["Date of Birth"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Gender
                </div>

                <div class="value">
                    ${user["Gender"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Blood Group
                </div>

                <div class="value">
                    ${user["Blood Group"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Current City
                </div>

                <div class="value">
                    ${user["Current City, Country"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Mobile Number
                </div>

                <div class="value">
                    ${user["Mobile Number with Country Code"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Email Address
                </div>

                <div class="value">
                    ${user["Email Address"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    WhatsApp Number
                </div>

                <div class="value">
                    ${user["What's App Number with Country Code"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Facebook ID
                </div>

                <div class="value">
                    ${user["Facebook ID"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Instagram ID
                </div>

                <div class="value">
                    ${user["Instagram ID"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Current Profession
                </div>

                <div class="value">
                    ${user["Current Profession / Field"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Company / Business Name
                </div>

                <div class="value">
                    ${user["Company / Business Name"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Marital Status
                </div>

                <div class="value">
                    ${user["Marital Status"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Spouse Profession
                </div>

                <div class="value">
                    ${user["Spouse Profession"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Number of Kids
                </div>

                <div class="value">
                    ${user["Number of Kids"] || ""}
                </div>

            </div>

            <div class="field">

                <div class="label">
                    Interested in Alumni Meetups
                </div>

                <div class="value">
                    ${user["Are you interested in alumni meetups ?"] || ""}
                </div>

            </div>

        `;
    }

    /* ======================================
       OPEN USER PROFILE FROM CONNECT
    ====================================== */

    function openProfileFromSheet(index){

    const user = allUsers[index];

    const area = document.getElementById("screen");

    area.innerHTML = `

        <div>

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:15px;
            ">

                <button
                onclick="showScreen('Sphere Connect')"
                class="main-btn"
                style="width:auto; padding:10px 15px;">

                    ← Back

                </button>

            </div>

            <img
            src="${user["Profile Photo"]}"
            class="profile-image">

            ${profileFields(user)}

        </div>

    `;
}

    function filterCards(){

    const input = document
    .getElementById("searchBox")
    .value
    .toLowerCase();

    const cards =
    document.querySelectorAll(".card");

    cards.forEach(card => {

        const searchableText =
        card.dataset.search.toLowerCase();

        if(searchableText.includes(input)){

            card.style.display = "block";

        }else{

            card.style.display = "none";

        }

    });

}

    const user = allUsers[index];

    const area = document.getElementById("screen");

    area.innerHTML = `

        <div>

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:15px;
            ">

                <button
                onclick="showScreen('Sphere Connect')"
                class="main-btn"
                style="width:auto; padding:10px 15px;">

                    ← Back

                </button>

            </div>

            <img
            src="${user["Profile Photo"]}"
            class="profile-image">

            ${profileFields(user)}

        </div>

    `;

    /* ======================================
       EDIT PROFILE
    ====================================== */

    function editProfile(user){

        const area = document.getElementById("screen");

        area.innerHTML = `

            <div style="padding:10px;">

                <h2 style="margin-bottom:20px;">
                    Edit Profile
                </h2>

                <div class="field">

                    <div class="label">
                        Full Name
                    </div>

                    <input
                    id="editName"
                    value="${user["Full Name"] || ""}">

                </div>

                <div class="field">

                    <div class="label">
                        Current City
                    </div>

                    <input
                    id="editCity"
                    value="${user["Current City, Country"] || ""}">

                </div>

                <div class="field">

                    <div class="label">
                        Profession
                    </div>

                    <input
                    id="editProfession"
                    value="${user["Current Profession / Field"] || ""}">

                </div>

                <button
                class="main-btn"
                onclick="saveProfile()">

                    Save Changes

                </button>

            </div>

        `;
    }

    /* ======================================
       SAVE PROFILE
    ====================================== */

    function saveProfile(){

        alert(
            "Profile updated successfully"
        );

        showScreen("My_Profile");

    }
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

window.firebaseApp = app;

</script>

</body>

</html>
